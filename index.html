<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYVIP STORE</title>
<style>
  :root{
    --bg:#080b12;
    --panel:#101522;
    --panel2:#151b2a;
    --border:#252d3d;
    --text:#f5f7fb;
    --muted:#9aa6bb;
    --accent:#7c5cff;
    --accent2:#4f8cff;
    --green:#22c55e;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 15% 0%,rgba(124,92,255,.16),transparent 30%),
      radial-gradient(circle at 90% 10%,rgba(79,140,255,.12),transparent 28%),
      var(--bg);
    color:var(--text);
  }
  a{text-decoration:none;color:inherit}
  button{font:inherit}
  .container{width:min(1160px,92%);margin:auto}
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(8,11,18,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.07);
  }
  .nav{
    min-height:72px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .logo{
    font-size:24px;font-weight:900;letter-spacing:.8px;
  }
  .logo span{
    background:linear-gradient(90deg,#fff,#9b87ff,#63a1ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  nav{display:flex;gap:24px}
  nav a{color:#aeb8ca;font-size:14px;font-weight:700}
  nav a:hover{color:#fff}
  .hero{padding:82px 0 50px}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 11px;border:1px solid rgba(124,92,255,.35);
    border-radius:999px;background:rgba(124,92,255,.08);
    color:#b9abff;font-size:12px;font-weight:800;
  }
  h1{
    font-size:clamp(42px,7vw,76px);
    line-height:.98;margin:20px 0 18px;letter-spacing:-3px;
  }
  .gradient{
    background:linear-gradient(90deg,#fff,#a996ff 48%,#74a9ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p{
    max-width:650px;color:var(--muted);font-size:18px;line-height:1.7;margin:0;
  }
  .search-wrap{margin-top:32px;max-width:580px}
  .search{
    width:100%;padding:15px 17px;border-radius:14px;
    border:1px solid var(--border);outline:none;
    background:#0d121d;color:#fff;font-size:15px;
  }
  .search:focus{border-color:#6852da;box-shadow:0 0 0 3px rgba(124,92,255,.12)}
  .section-head{
    display:flex;justify-content:space-between;align-items:end;
    gap:20px;margin:25px 0 20px;
  }
  .section-head h2{margin:0;font-size:28px}
  .count{color:var(--muted);font-size:13px}
  .apps-grid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;
    padding-bottom:80px;
  }
  .app-card{
    border:1px solid var(--border);background:linear-gradient(180deg,#111725,#0d121d);
    border-radius:20px;overflow:hidden;transition:.22s ease;
  }
  .app-card:hover{transform:translateY(-4px);border-color:#3b4560;box-shadow:0 16px 50px rgba(0,0,0,.25)}
  .app-preview{
    height:230px;background:#080b11;display:flex;align-items:center;justify-content:center;
    overflow:hidden;border-bottom:1px solid var(--border);
  }
  .app-preview img{width:100%;height:100%;object-fit:cover}
  .app-preview.contain img{object-fit:contain;padding:25px}
  .app-body{padding:23px}
  .app-body h3{margin:0 0 8px;font-size:22px}
  .meta{font-size:13px;color:#8f9ab0;margin-bottom:14px}
  .description{color:#aab4c7;line-height:1.6;font-size:14px;min-height:68px}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin:17px 0}
  .tag{
    border:1px solid #2a3347;background:#121927;color:#aeb9cd;
    border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:0;border-radius:11px;padding:12px 16px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;font-weight:800;cursor:pointer;width:100%;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.secondary{
    background:#151c2a;border:1px solid #2d374b;
  }
  .detail{display:none;padding:55px 0 90px}
  .back{
    display:inline-flex;align-items:center;gap:8px;color:#aeb8ca;
    margin-bottom:28px;font-weight:800;font-size:14px;cursor:pointer;
  }
  .back:hover{color:#fff}
  .detail-hero{
    display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;
    padding-bottom:38px;border-bottom:1px solid var(--border);
  }
  .detail-title{font-size:clamp(38px,6vw,64px);letter-spacing:-2px;margin:0 0 12px}
  .detail-sub{color:var(--muted);font-size:16px;line-height:1.7}
  .detail-image{
    min-height:280px;border:1px solid var(--border);border-radius:18px;
    overflow:hidden;background:#090d15;display:flex;align-items:center;justify-content:center;
  }
  .detail-image img{width:100%;height:100%;max-height:340px;object-fit:contain}
  .detail-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  .detail-actions .btn{width:auto;min-width:170px}
  .feature-section{padding:34px 0}
  .feature-section h2,.gallery-section h2,.video-section h2{font-size:24px;margin:0 0 18px}
  .features{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;
  }
  .feature{
    border:1px solid var(--border);background:#0e1420;border-radius:13px;
    padding:15px;color:#d5dbea;font-size:14px;
  }
  .gallery{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;
  }
  .gallery img{
    width:100%;height:230px;object-fit:cover;border-radius:15px;
    border:1px solid var(--border);background:#080b11;cursor:pointer;
  }
  .video-section{margin-top:34px}
  .video-wrap{
    border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#000;
  }
  video{display:block;width:100%;max-height:620px}
  .empty{
    padding:30px;border:1px dashed #30394c;border-radius:15px;color:var(--muted);
    text-align:center;
  }
  footer{border-top:1px solid var(--border);padding:28px 0;color:#68758b;font-size:13px}
  .notice{
    margin-top:14px;color:#78859b;font-size:12px;line-height:1.5;
  }
  @media(max-width:850px){
    .apps-grid{grid-template-columns:1fr}
    .detail-hero{grid-template-columns:1fr}
    .features{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:600px){
    nav{display:none}
    .hero{padding-top:55px}
    .features,.gallery{grid-template-columns:1fr}
    .app-preview{height:210px}
    h1{letter-spacing:-2px}
  }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="logo" href="#" onclick="showHome();return false;"><span>SKYVIP STORE</span></a>
    <nav>
      <a href="#" onclick="showHome();return false;">Apps</a>
      <a href="#apps" onclick="showHome();return false;">Categories</a>
      <a href="#about">About</a>
    </nav>
  </div>
</header>

<main>
  <section id="home">
    <div class="container hero">
      <div class="badge">✦ SKYVIP APP STORE</div>
      <h1>All your apps.<br><span class="gradient">One place.</span></h1>
      <p>Download and explore the latest SKYVIP apps, with screenshots, videos, features and direct APK downloads.</p>
      <div class="search-wrap">
        <input id="search" class="search" type="search" placeholder="Search apps..." oninput="renderApps()">
      </div>
    </div>

    <div class="container" id="apps">
      <div class="section-head">
        <h2>Featured Apps</h2>
        <div class="count" id="appCount"></div>
      </div>
      <div class="apps-grid" id="appsGrid"></div>
    </div>
  </section>

  <section id="detail" class="detail">
    <div class="container">
      <div class="back" onclick="showHome()">← Back to all apps</div>
      <div id="detailContent"></div>
    </div>
  </section>
</main>

<footer id="about">
  <div class="container">© 2026 SKYVIP STORE · Apps, downloads and media in one place.</div>
</footer>

<script>
const apps = [
  {
    name: "SKYVIP Smarters",
    version: "5.0",
    platforms: "Android · Google TV · Fire TV",
    description: "A feature-rich video player with Live TV, Movies & Series, EPG, Catch Up, Multi-screen and more.",
    image: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/5.0/photo_2026-02-21_01-42-48.jpg",
    tags: ["Video Player","Android","Fire TV"],
    features: [
      "Built-in VPN",
      "Download movies and series for offline viewing",
      "Live TV",
      "Movies & Series",
      "EPG",
      "Catch Up",
      "Multi-screen",
      "Subtitles",
      "Parental controls"
    ],
    screenshots: [
      "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/5.0/photo_2026-02-21_01-42-48.jpg",
      "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/5.0/photo_2026-02-21_01-42-49.jpg",
      "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/5.0/photo_2026-02-21_01-42-50.jpg"
    ],
    video: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/5.0/skyvip.smarters.MP4",
    download: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/5.0/SkyVIP.Smarters.apk"
  },
  {
    name: "SKYVIP Tivi",
    version: "1.0",
    platforms: "Android TV",
    description: "A TV-focused app with built-in VPN, live TV recording, sports fixtures and flexible folder management.",
    image: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Tivi/photo.Tivi.jpg",
    tags: ["Live TV","Sports","EPG","Android TV"],
    features: [
      "Built-in VPN",
      "Record Live TV",
      "Built-in sports fixtures",
      "Rearrange folders",
      "Hide folders",
      "Delete folders",
      "Live TV",
      "Movies & Series",
      "EPG",
      "Catch Up",
      "Multi-screen",
      "Subtitles",
      "Parental controls"
    ],
    screenshots: [
      "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Tivi/photo.Tivi.jpg",
      "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Tivi/photo_2026-08-2.jpg"
    ],
    video: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Tivi/Tivimate.Sport.fixtures.mp4",
    download: null,
    release: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/tag/Tivi"
  },
  {
    name: "Nuvio VOD",
    version: "Latest",
    platforms: "TV",
    description: "Movies & Series app for watching your VOD library on your TV.",
    image: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Nuvio/nuvio-social-preview.png",
    tags: ["VOD","Movies & Series","TV"],
    features: [
      "Movies & Series",
      "VOD library",
      "TV-focused interface"
    ],
    screenshots: [],
    video: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Nuvio/nuvio.vod.mp4",
    download: null,
    release: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/tag/Nuvio"
  },
  {
    name: "YouTube Premium",
    version: "1.0.8",
    platforms: "TV",
    description: "YouTube Premium app for TV devices.",
    image: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Youtube/photo_2026-02-12_12-14-17.jpg",
    tags: ["YouTube","Premium","TV"],
    features: [
      "YouTube Premium",
      "TV-focused app"
    ],
    screenshots: [
      "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Youtube/photo_2026-02-12_12-14-17.jpg",
      "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Youtube/photo_2026-02-12_12-25-05.jpg",
      "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Youtube/photo_2026-02-12_12-25-06.2.jpg"
    ],
    video: null,
    download: "https://github.com/kaneexd-cpu/SKYVIP-STORE/releases/download/Youtube/Tube.Premium_1.0.8.Encrypted.apk"
  }
];

function renderApps(){
  const grid = document.getElementById("appsGrid");
  const query = document.getElementById("search").value.trim().toLowerCase();

  const filtered = apps.filter(app =>
    [app.name, app.version, app.platforms, app.description, ...(app.tags || [])]
      .join(" ").toLowerCase().includes(query)
  );

  document.getElementById("appCount").textContent =
    filtered.length + (filtered.length === 1 ? " app" : " apps");

  if(!filtered.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No apps found.</div>';
    return;
  }

  grid.innerHTML = filtered.map(app => {
    const index = apps.indexOf(app);
    const contain = app.name === "Nuvio VOD" ? "contain" : "";
    return `
      <article class="app-card">
        <div class="app-preview ${contain}">
          <img src="${app.image}" alt="${app.name}" loading="lazy">
        </div>
        <div class="app-body">
          <h3>${app.name}</h3>
          <div class="meta">Version ${app.version} · ${app.platforms}</div>
          <div class="description">${app.description}</div>
          <div class="tags">
            ${(app.tags || []).map(tag => `<span class="tag">${tag}</span>`).join("")}
          </div>
          <button class="btn" onclick="showApp(${index})">View App →</button>
        </div>
      </article>
    `;
  }).join("");
}

function showApp(index){
  const app = apps[index];
  document.getElementById("home").style.display = "none";
  document.getElementById("detail").style.display = "block";
  window.scrollTo({top:0,behavior:"smooth"});

  const screenshots = app.screenshots.length
    ? `
      <section class="gallery-section" style="padding-top:34px">
        <h2>Screenshots</h2>
        <div class="gallery">
          ${app.screenshots.map((src,i) =>
            `<img src="${src}" alt="${app.name} screenshot ${i+1}" loading="lazy" onclick="window.open('${src}','_blank')">`
          ).join("")}
        </div>
      </section>
    `
    : "";

  const video = app.video
    ? `
      <section class="video-section">
        <h2>App Video</h2>
        <div class="video-wrap">
          <video controls preload="metadata">
            <source src="${app.video}" type="video/mp4">
            Your browser does not support video playback.
          </video>
        </div>
      </section>
    `
    : "";

  let actionButton = "";
  if(app.download){
    actionButton = `<a class="btn" href="${app.download}">⬇ Download APK</a>`;
  } else {
    actionButton = `<a class="btn secondary" href="${app.release}" target="_blank" rel="noopener">APK not uploaded · View Release</a>`;
  }

  document.getElementById("detailContent").innerHTML = `
    <div class="detail-hero">
      <div>
        <div class="badge">AVAILABLE NOW</div>
        <h1 class="detail-title">${app.name}</h1>
        <div class="detail-sub">Version ${app.version} · ${app.platforms}<br>${app.description}</div>
        <div class="detail-actions">
          ${actionButton}
          <button class="btn secondary" onclick="showHome()">← All Apps</button>
        </div>
        ${!app.download ? `<div class="notice">The GitHub release currently does not contain an APK asset, so the release page is linked instead.</div>` : ""}
      </div>
      <div class="detail-image ${app.name === "Nuvio VOD" ? "contain" : ""}">
        <img src="${app.image}" alt="${app.name}">
      </div>
    </div>

    <section class="feature-section">
      <h2>Features</h2>
      <div class="features">
        ${app.features.map(feature => `<div class="feature">✓ ${feature}</div>`).join("")}
      </div>
    </section>

    ${screenshots}
    ${video}
  `;
}

function showHome(){
  document.getElementById("detail").style.display = "none";
  document.getElementById("home").style.display = "block";
  window.scrollTo({top:0,behavior:"smooth"});
}

renderApps();
</script>
</body>
</html>
